name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go: ["1.22", "1.23"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 -timeout=120s ./...

      - name: Benchmark (quick sanity pass)
        run: go test -bench=. -benchtime=1x -benchmem ./internal/counter/

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o bin/wordcounter-linux-amd64 ./cmd/wordcounter

      - name: Build macOS arm64
        run: GOOS=darwin GOARCH=arm64 go build -o bin/wordcounter-darwin-arm64 ./cmd/wordcounter

      - name: Build Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o bin/wordcounter-windows-amd64.exe ./cmd/wordcounter
